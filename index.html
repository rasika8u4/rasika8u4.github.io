<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ආරණ්‍යගේ අභ්‍යන්තර කවුන්සිලය - The Mind Council</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Sinhala", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: var(--card-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .header {
            padding: 18px 24px;
            background: #090d16;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--accent);
        }
        .header span {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .user-msg {
            background: #0284c7;
            align-self: flex-end;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .bot-msg {
            background: #0b1329;
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }
        .persona-vibhava { color: #38bdf8; font-weight: bold; }
        .persona-jaya { color: #f472b6; font-weight: bold; }
        .persona-caster { color: #facc15; font-weight: bold; }
        .persona-vidushaka { color: #a78bfa; font-weight: bold; }
        .persona-athmika { color: #4ade80; font-weight: bold; }
        .persona-thatta { color: #fb923c; font-weight: bold; }
        
        .input-area {
            padding: 16px;
            background: #090d16;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            padding: 12px 24px;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; }
        .config-bar {
            padding: 8px 24px;
            background: #050811;
            font-size: 0.8rem;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .config-bar input {
            background: #1e293b;
            border: 1px solid #334155;
            color: #aaa;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            width: 250px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div>
            <h1>ආරණ්‍යගේ අභ්‍යන්තර කවුන්සිලය</h1>
            <span>විභව | ජායා | කැස්ටර් | විදූෂක | ආත්මිකා | තට්ටයා</span>
        </div>
    </div>
    
    <!-- Free API Configuration (Stored safely in your browser localStorage) -->
    <div class="config-bar">
        <label>Groq API Key (Free):</label>
        <input type="password" id="apiKey" placeholder="gsk_..." onchange="saveKey()">
        <span style="color:#64748b;">(Key එක ඔබේ Browser එකේ පමණක් සුරැකේ)</span>
    </div>

    <div class="messages" id="messages">
        <div class="message bot-msg">
            <strong>තට්ට රැවුල්කාරයා:</strong> ආයුබෝවන් ආරණ්‍ය... ඔබේ සිතේ ඇති ගැටලුව, සැකය හෝ නිර්මාණාත්මක අවුල මෙතැන තබන්න. බලමු අපේ මේ පිස්සන් හත්දෙනා ඒ ගැන මොකද කියන්නේ කියලා!
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="ඔබේ සිතේ ඇති ගැටලුව මෙතැන ලියන්න..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()" id="sendBtn">විමසන්න</button>
    </div>
</div>

<script>
    const SYSTEM_PROMPT = `ඔබ "ආරණ්‍යගේ අභ්‍යන්තර කවුන්සිලය" (The Council of Aranya) නමැති බහු-පෞරුෂ (Multi-Agent) දාර්ශනික උපදේශක AI එකයි.
පරිශීලකයා ඉදිරිපත් කරන ඕනෑම ජීවිත ගැටලුවක්, තීරණයක් හෝ ප්‍රශ්නයක් ගැන පහත චරිත එකිනෙකා සමඟ වාද කර අවසාන ප්‍රායෝගික විසඳුම ලබාදිය යුතුය:

1. [විභව]: තර්කය, අවදානම, වියදම්, සංඛ්‍යාලේඛන සහ බුද්ධිය.
2. [ජායා]: හැඟීම, වේදනාව, සුන්දරත්වය, ආදරය සහ මනුෂ්‍යත්වය.
3. [කැස්ටර්]: ශ්‍රමය, දහඩිය, බඩගින්න, පවුලේ පැවැත්ම සහ භෞතික යථාර්ථය.
4. [විදූෂක]: කළු හාස්‍යය, උපහාසය සහ නරුම සත්‍යය.
5. [ආත්මිකා]: ආධ්‍යාත්මික සත්‍යය, මව් සෙනෙහස සහ විශ්වීය කරුණාව.
6. [තට්ට රැවුල්කාරයා]: සෙන් මාස්ටර්, සියල්ල සමතුලිත කර අවසාන ප්‍රායෝගික මඟපෙන්වීම දෙන නායකයා.

ආකෘතිය:
- චරිත 3-4ක් එකිනෙකාගේ අදහස් විවේචනය කරමින් නාට්‍යමය ලෙස සිංහලෙන් සංවාදයේ යෙදිය යුතුය.
- අවසානයේ [තට්ට රැවුල්කාරයා] පැමිණ සාරාංශගත ප්‍රායෝගික විසඳුම දිය යුතුය.`;

    // Load saved API key
    document.getElementById('apiKey').value = localStorage.getItem('groq_api_key') || '';

    function saveKey() {
        localStorage.setItem('groq_api_key', document.getElementById('apiKey').value);
    }

    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();

        if (!text) return;
        if (!apiKey) {
            alert('කරුණාකර Groq වෙතින් ලබාගත් Free API Key එක ඇතුළත් කරන්න!');
            return;
        }

        // Add User Message
        const msgContainer = document.getElementById('messages');
        msgContainer.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = '';
        msgContainer.scrollTop = msgContainer.scrollHeight;

        // Add Loading Placeholder
        const loadingId = 'loading-' + Date.now();
        msgContainer.innerHTML += `<div class="message bot-msg" id="${loadingId}"><em>කවුන්සිලය වාද විවාද කරමින් පවතී...</em></div>`;
        msgContainer.scrollTop = msgContainer.scrollHeight;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: [
                        { role: 'system', content: SYSTEM_PROMPT },
                        { role: 'user', content: text }
                    ],
                    temperature: 0.8
                })
            });

            const data = await response.json();
            const reply = data.choices[0].message.content;
            
            // Format personas with colors
            let formattedReply = reply
                .replace(/\[විභව\]/g, '<span class="persona-vibhava">[විභව]</span>')
                .replace(/\[ජායා\]/g, '<span class="persona-jaya">[ජායා]</span>')
                .replace(/\[කැස්ටර්\]/g, '<span class="persona-caster">[කැස්ටර්]</span>')
                .replace(/\[විදූෂක\]/g, '<span class="persona-vidushaka">[විදූෂක]</span>')
                .replace(/\[ආත්මිකා\]/g, '<span class="persona-athmika">[ආත්මිකා]</span>')
                .replace(/\[තට්ට රැවුල්කාරයා\]/g, '<span class="persona-thatta">[තට්ට රැවුල්කාරයා]</span>');

            document.getElementById(loadingId).innerHTML = formattedReply;
        } catch (error) {
            document.getElementById(loadingId).innerHTML = `<span style="color:red;">දෝෂයක් සිදුවිය: API Key එක නිවැරදිදැයි පරීක්ෂා කරන්න.</span>`;
        }

        msgContainer.scrollTop = msgContainer.scrollHeight;
    }
</script>
</body>
</html>
